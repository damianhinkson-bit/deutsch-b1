<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch Grammatik</title>
<meta name="description" content="German grammar trainer for A1, A2 and B1: rule cards and drills for each rule.">
<meta name="theme-color" content="#0e4f5c">

<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Bricolage";src:url("fonts/bricolage.woff2") format("woff2");font-weight:200 800;font-display:swap}
:root{
  --bg:#f5f2ec;--surface:#ffffff;--surface-2:#eef3f3;--ink:#12262b;--ink-2:#4d6266;--line:#dde4e4;
  --petrol:#0e4f5c;--petrol-2:#17707f;--petrol-soft:#dcebed;
  --amber:#e8961e;--amber-ink:#8a5200;--amber-soft:#fbecd3;
  --good:#1d7a52;--good-soft:#dcf1e6;--bad:#b83b2e;--bad-soft:#f8e0dc;
  --shadow:0 1px 2px rgba(14,79,92,.06),0 4px 14px rgba(14,79,92,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1b1f;--surface:#122a30;--surface-2:#17343b;--ink:#e7efef;--ink-2:#9fb4b7;--line:#244449;
  --petrol:#5fb7c4;--petrol-2:#7ccad5;--petrol-soft:#173c43;
  --amber:#f2ac45;--amber-ink:#f6c477;--amber-soft:#3a2b12;
  --good:#5fd29b;--good-soft:#123628;--bad:#f08a7d;--bad-soft:#3d1c18;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0b1b1f;--surface:#122a30;--surface-2:#17343b;--ink:#e7efef;--ink-2:#9fb4b7;--line:#244449;
  --petrol:#5fb7c4;--petrol-2:#7ccad5;--petrol-soft:#173c43;
  --amber:#f2ac45;--amber-ink:#f6c477;--amber-soft:#3a2b12;
  --good:#5fd29b;--good-soft:#123628;--bad:#f08a7d;--bad-soft:#3d1c18;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Bricolage",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.top h1{font-size:22px;margin:0;font-weight:750;letter-spacing:-.01em;flex:1;min-width:0}
.top h1 small{display:block;font-size:13px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.warn{background:var(--amber-soft);color:var(--amber-ink);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.hero{background:var(--petrol);color:#fff;border-radius:22px;padding:18px;margin:4px 0 18px;position:relative;overflow:hidden}
:root[data-theme="dark"] .hero{background:#0f3d46}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#0f3d46}}
.hero .big{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em}
.hero .lbl{font-size:14px;opacity:.85;margin-top:4px}
.hero .bar{height:8px;background:rgba(255,255,255,.18);border-radius:8px;margin:14px 0 16px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--amber);border-radius:8px}
.hero-actions{display:flex;gap:10px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:650;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn-amber{background:var(--amber);color:#2a1800}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff}
.btn-primary{background:var(--petrol);color:#fff;width:100%}
:root[data-theme="dark"] .btn-primary{color:#06252b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#06252b}}
.btn-line{background:var(--surface);border:1px solid var(--line);width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.hero-actions .btn{flex:1;padding:12px 10px;font-size:15px}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:22px 2px 10px}
.rules{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.rule{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--shadow);width:100%}
.rule .num{width:38px;height:38px;border-radius:11px;background:var(--petrol-soft);color:var(--petrol);display:grid;place-items:center;font-weight:750;flex:none}
.rule .meta{flex:1;min-width:0}
.rule .t{font-weight:650;line-height:1.25}
.rule .s{font-size:14px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{height:6px;background:var(--surface-2);border-radius:6px;margin-top:9px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--petrol-2);border-radius:6px}
.mbar i.gold{background:var(--amber)}
.pct{font-size:13px;font-weight:700;color:var(--ink-2);flex:none;text-align:right;min-width:44px}
.pct span{display:block;font-weight:500;font-size:11.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card p{margin:0 0 10px}
.intro{font-size:18px}
.tbl{overflow-x:auto;margin:6px -4px 10px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--petrol);font-weight:700;white-space:nowrap}
td:first-child{font-weight:600}
tr:last-child td{border-bottom:0}
td.nw{white-space:nowrap}
ul.pts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.pts li{padding-left:22px;position:relative}
ul.pts li:before{content:"";position:absolute;left:4px;top:.6em;width:8px;height:8px;border-radius:3px;background:var(--amber)}
b{font-weight:700;color:var(--petrol)}
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .de{font-weight:600}
.ex .en{font-size:14px;color:var(--ink-2)}
.ex>div{flex:1}
.say{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--petrol)}
.say svg{width:18px;height:18px}
.sticky-cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:4}
.sticky-cta .in{max-width:608px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--petrol);background:var(--petrol-soft);color:var(--petrol)}
.chip small{font-weight:500;color:var(--ink-2)}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px;font-weight:650}
.seg button.on{background:var(--surface);box-shadow:var(--shadow);color:var(--petrol)}
.pick{display:grid;gap:6px}
.pick label{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15.5px}
.pick input{width:20px;height:20px;accent-color:var(--petrol);flex:none}
.pick .p{margin-left:auto;font-size:13px;color:var(--ink-2)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.linkbtn{border:0;background:none;color:var(--petrol);font-weight:650;padding:4px 2px;font-size:15px}
/* session */
.prog{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--amber);transition:width .3s}
.count{font-size:14px;font-weight:650;color:var(--ink-2);min-width:52px;text-align:right}
.tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--petrol);background:var(--petrol-soft);border-radius:8px;padding:4px 9px;margin-bottom:10px}
.kind{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--amber-ink);margin:2px 0 10px}
.q{font-size:22px;font-weight:600;line-height:1.5;margin:0 0 8px}
.q .blank{display:inline-block;min-width:64px;border-bottom:2.5px solid var(--amber);margin:0 2px}
.gapin{font:inherit;font-weight:700;color:var(--petrol);border:0;border-bottom:2.5px solid var(--amber);background:var(--amber-soft);border-radius:8px 8px 0 0;padding:0 8px;width:7.5em;max-width:60vw;outline:none;text-align:center}
.gapin:focus{background:var(--petrol-soft);border-bottom-color:var(--petrol)}
.hint{display:inline-block;font-size:15px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:3px 9px;margin-top:4px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;font-weight:600;font-size:17px;min-height:52px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.src{font-size:20px;font-weight:600;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.task{font-weight:650;color:var(--petrol);margin-bottom:10px}
textarea.uf{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);resize:vertical;font-size:18px;outline:none}
textarea.uf:focus{border-color:var(--petrol)}
.keys{display:flex;gap:8px;margin:10px 0 4px}
.keys button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-weight:700;font-size:18px}
.build{min-height:64px;border:1.5px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:var(--surface);margin-top:6px}
.build.empty:before{content:attr(data-ph);color:var(--ink-2);font-size:14.5px;padding:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tok{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 13px;font-weight:650;font-size:17px;box-shadow:var(--shadow)}
.build .tok:first-child{text-transform:capitalize}
.build .tok{background:var(--petrol-soft);border-color:transparent;color:var(--petrol)}
.tok.comma{min-width:38px}
.fb{border-radius:var(--r);padding:16px;margin-top:16px;border:1.5px solid}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb.almost{background:var(--amber-soft);border-color:var(--amber)}
.fb h3{margin:0 0 6px;font-size:18px}
.fb.ok h3{color:var(--good)}.fb.no h3{color:var(--bad)}.fb.almost h3{color:var(--amber-ink)}
.fb .ans{display:flex;gap:10px;align-items:center;font-size:18px;font-weight:650;margin:4px 0}
.fb .ans>div{flex:1}
.fb .yours{font-size:14.5px;color:var(--ink-2);margin:2px 0 6px}
.fb .yours s{text-decoration-color:var(--bad)}
.fb .why{font-size:15.5px;margin-top:8px}
.fb .en{font-size:14.5px;color:var(--ink-2);margin-top:4px;font-style:italic}
.fb .tip{font-size:14.5px;font-weight:600;color:var(--amber-ink);margin-top:6px}
.actions{margin-top:16px;display:grid;gap:10px}
.res-big{font-size:56px;font-weight:800;color:var(--petrol);line-height:1;letter-spacing:-.02em}
.miss{padding:10px 0;border-bottom:1px solid var(--line)}
.miss:last-child{border-bottom:0}
.miss .a{font-weight:650}
.miss .w{font-size:14px;color:var(--ink-2)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle small{display:block;color:var(--ink-2);font-size:13.5px}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;transition:.2s}
.sw span:before{content:"";position:absolute;width:24px;height:24px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+span{background:var(--petrol)}
.sw input:checked+span:before{transform:translateX(22px)}
.sw input:disabled+span{opacity:.5}
.lang{flex:none;display:flex;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:3px;height:42px;align-items:stretch}
.lang span{display:grid;place-items:center;min-width:34px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink-2);letter-spacing:.03em}
.lang span.on{background:var(--petrol);color:#fff}
:root[data-theme="dark"] .lang span.on{color:#06252b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lang span.on{color:#06252b}}
.levels{display:flex;gap:8px;margin:2px 0 14px}
.levels button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 6px 8px;text-align:center;box-shadow:var(--shadow)}
.levels b{display:block;font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.levels small{display:block;font-size:12px;font-weight:600;color:var(--ink-2)}
.levels button.on{border-color:var(--petrol);background:var(--petrol)}
.levels button.on b,.levels button.on small{color:#fff}
:root[data-theme="dark"] .levels button.on b,:root[data-theme="dark"] .levels button.on small{color:#06252b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .levels button.on b,:root:not([data-theme="light"]) .levels button.on small{color:#06252b}}
.empty-note{color:var(--ink-2);font-size:15px;text-align:center;padding:16px}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (min-width:600px){.q{font-size:24px}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap" id="app"></main>
<div id="cta"></div>
<script>
// A1 grammar content (same item format as data.js)
const RULES_A1 = [
{
  id: "a1-praesens",
  title: "Präsens: Verben konjugieren",
  sub: "ich komme, du kommst, er kommt",
  card: {
    intro: "Every verb in the present tense takes an <b>ending</b> that matches the subject. Take off <b>-en</b> and add the ending.",
    tables: [
      { h: ["", "kommen", "arbeiten", "heißen"], r: [
        ["ich", "komm<b>e</b>", "arbeit<b>e</b>", "heiß<b>e</b>"],
        ["du", "komm<b>st</b>", "arbeit<b>est</b>", "heiß<b>t</b>"],
        ["er/sie/es", "komm<b>t</b>", "arbeit<b>et</b>", "heiß<b>t</b>"],
        ["wir", "komm<b>en</b>", "arbeit<b>en</b>", "heiß<b>en</b>"],
        ["ihr", "komm<b>t</b>", "arbeit<b>et</b>", "heiß<b>t</b>"],
        ["sie/Sie", "komm<b>en</b>", "arbeit<b>en</b>", "heiß<b>en</b>"]
      ]},
      { h: ["Change", "Examples (du / er)"], r: [
        ["e → i", "sprechen: sprichst, spricht · essen: isst, isst · geben: gibst, gibt · nehmen: nimmst, nimmt"],
        ["e → ie", "sehen: siehst, sieht · lesen: liest, liest"],
        ["a → ä", "fahren: fährst, fährt · schlafen: schläfst, schläft · tragen: trägst, trägt"]
      ]}
    ],
    points: [
      "The vowel change only happens with <b>du</b> and <b>er/sie/es</b>: ich spreche, du <b>sprichst</b>, wir sprechen.",
      "Stem ends in -t or -d → add an extra e: du arbeit<b>est</b>, er find<b>et</b>.",
      "Stem ends in -s, -ß, -z → du only adds -t: du hei<b>ßt</b>, du tan<b>zt</b>."
    ],
    examples: [
      ["Ich komme aus Barbados.", "I come from Barbados."],
      ["Sprichst du Deutsch?", "Do you speak German?"],
      ["Er fährt jeden Tag mit dem Bus.", "He takes the bus every day."]
    ]
  },
  items: [
    { t: "gap", q: "Ich ___ aus Barbados.", h: "kommen", a: ["komme"], en: "I come from Barbados.", why: "ich → -e." },
    { t: "gap", q: "Du ___ sehr gut Deutsch.", h: "sprechen", a: ["sprichst"], en: "You speak German very well.", why: "sprechen changes e → i with du: sprichst." },
    { t: "gap", q: "Er ___ jeden Tag die Zeitung.", h: "lesen", a: ["liest"], en: "He reads the newspaper every day.", why: "lesen changes e → ie: er liest." },
    { t: "gap", q: "Wir ___ in Hamburg.", h: "wohnen", a: ["wohnen"], en: "We live in Hamburg.", why: "wir → -en." },
    { t: "gap", q: "Wie ___ du?", h: "heißen", a: ["heißt"], en: "What's your name?", why: "Stem ends in ß → du only adds -t: heißt." },
    { t: "gap", q: "Anna ___ heute bis 18 Uhr.", h: "arbeiten", a: ["arbeitet"], en: "Anna works until 6 pm today.", why: "Stem ends in -t → extra e: arbeitet." },
    { t: "gap", q: "Ihr ___ zu schnell!", h: "fahren", a: ["fahrt"], en: "You're driving too fast!", why: "ihr has no vowel change: ihr fahrt." },
    { t: "gap", q: "Mein Sohn ___ gern Pizza.", h: "essen", a: ["isst"], en: "My son likes eating pizza.", why: "essen → er isst." },
    { t: "mc", q: "___ du morgen nach Berlin?", o: ["Fährst", "Fahrst", "Fährt"], en: "Are you going to Berlin tomorrow?", why: "fahren: a → ä with du: fährst." },
    { t: "mc", q: "Er ___ am Wochenende lange.", o: ["schläft", "schlaft", "schläfst"], en: "He sleeps in at the weekend.", why: "schlafen: er schläft." },
    { t: "mc", q: "Was ___ ihr am Abend?", o: ["macht", "machen", "machst"], en: "What are you doing this evening?", why: "ihr → -t." },
    { t: "mc", q: "Ich ___ einen Kaffee.", h: "nehmen", o: ["nehme", "nimm", "nimmt"], en: "I'll have a coffee.", why: "No vowel change with ich: ich nehme." },
    { t: "mc", q: "Maria ___ einen Film.", h: "sehen", o: ["sieht", "seht", "siehst"], en: "Maria is watching a film.", why: "sehen: e → ie with er/sie: sieht." },
    { t: "mc", q: "Du ___ immer so viel.", h: "arbeiten", o: ["arbeitest", "arbeitst", "arbeiten"], en: "You always work so much.", why: "Stem ends in -t → du arbeitest." },
    { t: "mc", q: "Wir ___ heute Abend Freunde.", h: "treffen", o: ["treffen", "trefft", "trifft"], en: "We're meeting friends tonight.", why: "wir → -en, no vowel change." },
    { t: "mc", q: "Mein Vater ___ mir Geld.", h: "geben", o: ["gibt", "gebt", "gebst"], en: "My father gives me money.", why: "geben: e → i: er gibt." },
    { t: "sb", s: "Ich wohne seit zwei Jahren in Berlin.", alt: ["Seit zwei Jahren wohne ich in Berlin."], en: "I've lived in Berlin for two years.", why: "Conjugated verb in position 2." },
    { t: "sb", s: "Was isst du gern?", en: "What do you like to eat?", why: "W-word, verb, subject." },
    { t: "sb", s: "Meine Schwester spricht drei Sprachen.", en: "My sister speaks three languages.", why: "sprechen → spricht." },
    { t: "sb", s: "Am Montag fährt er nach Köln.", alt: ["Er fährt am Montag nach Köln."], en: "On Monday he's going to Cologne.", why: "fahren → fährt; verb stays in position 2." },
    { t: "sb", s: "Liest du gern Bücher?", en: "Do you like reading books?", why: "Yes/no question: verb first." },
    { t: "sb", s: "Wir arbeiten heute im Garten.", alt: ["Heute arbeiten wir im Garten."], en: "We're working in the garden today.", why: "wir arbeiten." },
    { t: "uf", q: "Ich spreche Englisch.", task: "Subjekt: er", a: ["Er spricht Englisch."], en: "He speaks English.", why: "er spricht (e → i)." },

/* ---------- storage (guarded) ---------- */
let storageOK = true;
let state = { box: {}, miss: {}, seen: {}, settings: { autoSpeak: false, theme: "auto", lang: "de", level: "A2" } };
function loadState(){
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      state.box = s.box || {}; state.miss = s.miss || {}; state.seen = s.seen || {};
      state.settings = Object.assign(state.settings, s.settings || {});
    }
    window.localStorage.setItem(STORE_KEY + "-test", "1");
    window.localStorage.removeItem(STORE_KEY + "-test");
  } catch (e) { storageOK = false; }
}
function saveState(){
  if (!storageOK) return;
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { storageOK = false; }
}

/* ---------- speech (guarded) ---------- */
let voice = null;
function getSynth(){
  try { return ("speechSynthesis" in window && window.speechSynthesis) ? window.speechSynthesis : null; }
  catch (e) { return null; }
}
function loadVoices(){
  const synth = getSynth(); if (!synth) return;
  try {
    const vs = synth.getVoices() || [];
    voice = vs.find(v => /^de[-_]DE/i.test(v.lang)) || vs.find(v => /^de/i.test(v.lang)) || null;
  } catch (e) { voice = null; }
}
function ttsAvailable(){ return !!getSynth(); }
function speak(text){
  const synth = getSynth(); if (!synth || !text) return;
  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE"; u.rate = 0.92;
    if (voice) u.voice = voice;
    synth.speak(u);
  } catch (e) {}
}
(function initVoices(){
  const synth = getSynth(); if (!synth) return;
  loadVoices();
  try { synth.onvoiceschanged = loadVoices; } catch (e) {}
})();

/* ---------- helpers ---------- */
const $app = document.getElementById("app");
const $top = document.getElementById("top");
const $cta = document.getElementById("cta");
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function key(ruleId, i){ return ruleId + ":" + i; }
const LEVELS = [["A1", RULES_A1], ["A2", RULES], ["B1", RULES_B1]];
const ALL_RULES = [];
LEVELS.forEach(([lv, rs]) => rs.forEach(r => { r.level = lv; ALL_RULES.push(r); }));
function curLevel(){ const l = state.settings.level; return (l === "A1" || l === "B1") ? l : "A2"; }
function levelRules(lv){ return LEVELS.find(x => x[0] === (lv || curLevel()))[1]; }
function ruleById(id){ return ALL_RULES.find(r => r.id === id); }
function cap1(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function cleanSb(s){ return s.replace(/\s+,/g, ","); }
function fullSentence(it){
  if (it.t === "gap") return it.q.replace("___", it.a[0]);
  if (it.t === "mc") {
    if (it.q.includes("___")) return it.q.replace("___", it.o[0]);
    if (/…\s*$/.test(it.q)) return it.q.replace(/…\s*$/, it.o[0]) + ".";
    return it.o[0];
  }
  if (it.t === "sb") return cleanSb(it.s);
  return it.a[0];
}
function speakBtn(text){

/* ---------- answer checking ---------- */
function norm(s, keepCommas){
  let t = String(s).toLowerCase()
    .replace(/[„“”"‚‘’'«»]/g, "")
    .replace(/[–—]/g, "-")
    .replace(/\bbitte\b/g, " ")
    .replace(/\s*,\s*/g, keepCommas ? ", " : " ")
    .replace(/[.!?]+\s*$/g, "")
    .replace(/\s+/g, " ").trim();
  return t;
}
function fold(s){ return s.replace(/ä|ae/g,"a").replace(/ö|oe/g,"o").replace(/ü|ue/g,"u").replace(/ß|ss/g,"s"); }
// returns {ok, almost, tip}
function checkText(input, answers, isSentence){
  const raw = String(input || "").trim();
  if (!raw) return { ok: false, empty: true };
  for (const a of answers) if (norm(raw, true) === norm(a, true)) return { ok: true };
  for (const a of answers) if (norm(raw, false) === norm(a, false)) {
    return { ok: true, tip: isSentence ? L("tipComma") : "" };
  }
  for (const a of answers) if (fold(norm(raw, false)) === fold(norm(a, false))) return { ok: false, almost: true, tip: L("tipUml") };
  return { ok: false };
}

/* ---------- mastery ---------- */
function boxOf(k){ return state.box[k] || 0; }
function ruleMastery(r){
  let sum = 0, seen = 0;
  r.items.forEach((_, i) => { const k = key(r.id, i); sum += boxOf(k); if (state.seen[k]) seen++; });
  return { pct: Math.round(100 * sum / (5 * r.items.length)), seen };
}
function levelLabel(m){
  if (!m.seen) return L("lvNew");
  if (m.pct < 30) return L("lvStart");
  if (m.pct < 60) return L("lvMid");
  if (m.pct < 90) return L("lvGood");
  return L("lvTop");
}
function overall(lv){
  let sum = 0, n = 0;
  levelRules(lv).forEach(r => r.items.forEach((_, i) => { sum += boxOf(key(r.id, i)); n++; }));
  return Math.round(100 * sum / (5 * n));
}
function missKeys(){ const lv = curLevel(); return Object.keys(state.miss).filter(k => { const [rid, i] = k.split(":"); const r = ruleById(rid); return r && r.level === lv && r.items[+i]; }); }
function record(k, correct){
  state.seen[k] = (state.seen[k] || 0) + 1;
  if (correct) { state.box[k] = Math.min(5, boxOf(k) + 1); delete state.miss[k]; }
  else { state.box[k] = 0; state.miss[k] = 1; }
  saveState();
}

/* ---------- setup ---------- */
let setup = { types: { gap: true, mc: true, sb: true, uf: true }, len: 10 };
function renderSetup(){
  const single = !view.mix;
  const sel = new Set(view.rules || []);
  topBar(single ? L("setupTitle") : L("mix") + " · " + curLevel(), single ? esc(ruleById(view.rules[0]).title) : L("mixSub"), backBtn());
  bindBack();
  let h = "";
  if (!single) {
    h += '<div class="row"><div class="sec" style="margin-top:6px">' + L("rules") + '</div><div><button class="linkbtn" id="all">' + L("all") + '</button> · <button class="linkbtn" id="none">' + L("none") + '</button></div></div><div class="pick">';
    levelRules().forEach(r => {
      h += '<label><input type="checkbox" data-r="' + r.id + '"' + (sel.has(r.id) ? " checked" : "") + "><span>" + esc(r.title) + '</span><span class="p">' + ruleMastery(r).pct + "%</span></label>";
    });
    h += "</div>";
  }
  h += '<div class="sec">' + L("types") + '</div><div class="chips">' + ["gap", "mc", "sb", "uf"].map(t => '<button class="chip' + (setup.types[t] ? " on" : "") + '" data-t="' + t + '">' + L("t_" + t) + "</button>").join("") + "</div>";
  h += '<div class="sec">' + L("length") + '</div><div class="seg">' + [10, 20, 0].map(n => '<button data-n="' + n + '" class="' + (setup.len === n ? "on" : "") + '">' + (n ? L("nQ", n) : L("allQ")) + "</button>").join("") + "</div>";
  h += '<p class="empty-note" id="avail"></p>';
  $app.innerHTML = '<div class="fade">' + h + "</div>";
  setCTA('<button class="btn btn-primary" id="start">' + L("go") + '</button>');
  const $start = document.getElementById("start"), $avail = document.getElementById("avail");
  function chosen(){ return single ? view.rules : Array.from($app.querySelectorAll("[data-r]")).filter(x => x.checked).map(x => x.dataset.r); }
  function pool(){
    const out = [];
    chosen().forEach(id => { const r = ruleById(id); r.items.forEach((it, i) => { if (setup.types[it.t]) out.push(key(id, i)); }); });
    return out;
  }
  function refresh(){
    const p = pool(), n = setup.len ? Math.min(setup.len, p.length) : p.length;
    $avail.textContent = p.length ? L("avail", n, p.length) : L("pickSome");
    $start.disabled = !p.length;
  }
  $app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { setup.types[b.dataset.t] = !setup.types[b.dataset.t]; b.classList.toggle("on"); refresh(); });
  $app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { setup.len = +b.dataset.n; $app.querySelectorAll("[data-n]").forEach(x => x.classList.toggle("on", x === b)); refresh(); });
  $app.querySelectorAll("[data-r]").forEach(c => c.onchange = () => { view.rules = chosen(); try { history.replaceState(view, ""); } catch (e) {} refresh(); });
  if (!single) {
    document.getElementById("all").onclick = () => { $app.querySelectorAll("[data-r]").forEach(c => c.checked = true); view.rules = chosen(); refresh(); };
    document.getElementById("none").onclick = () => { $app.querySelectorAll("[data-r]").forEach(c => c.checked = false); view.rules = chosen(); refresh(); };
  }
  $start.onclick = () => {
    const p = pool(); if (!p.length) return;
    // weakest first, random within the same box, then shuffle the chosen set
    const ranked = shuffle(p).sort((a, b) => boxOf(a) - boxOf(b));
    const pick = setup.len ? ranked.slice(0, setup.len) : ranked;
    const label = single ? ruleById(view.rules[0]).title : "#lblMix";
    startSession(shuffle(pick), label);
  };
  refresh();
}

/* ---------- session ---------- */
function startSession(keys, label){
  const queue = keys.map(k => ({ k, retry: 0 }));
  session = { label, queue, pos: 0, total: keys.length, done: 0, correct: 0, missed: [], answered: false, cur: null };
  go({ name: "session" });
}
function itemOf(k){ const [rid, i] = k.split(":"); const r = ruleById(rid); return { r, it: r.items[+i] }; }

function renderSession(){
  if (!session) return go({ name: "home" }, true);
  if (session.pos >= session.queue.length) return go({ name: "results" }, true);
  const entry = session.queue[session.pos];
  const { r, it } = itemOf(entry.k);
  const fresh = session.renderedPos !== session.pos;
  if (fresh) { session.renderedPos = session.pos; session.answered = false; session.fb = null; session.opts = null; session.sb = null; }
  const pct = Math.round(100 * session.done / session.total);
  $top.innerHTML = '<button class="icon-btn" id="quit" aria-label="' + L("quit") + '">' + ICON.close + '</button><div class="prog"><i style="width:' + pct + '%"></i></div><div class="count">' + Math.min(session.done + 1, session.total) + " / " + session.total + "</div>" + langBtn();
  bindLang();
  document.getElementById("quit").onclick = () => { if (session.done === 0 || confirm(L("quitAsk"))) { session.done ? go({ name: "results" }, true) : (session = null, history.back()); } };
  let h = '<div class="fade"><span class="tag">' + esc(r.title) + "</span>" + (entry.retry ? ' <span class="tag" style="background:var(--amber-soft);color:var(--amber-ink)">' + L("again") + '</span>' : "");
  h += '<div class="kind">' + L("t_" + it.t) + " · " + L("h_" + it.t) + "</div>";
  if (it.t === "gap") {
    const parts = it.q.split("___");
    h += '<p class="q">' + esc(parts[0]) + '<input class="gapin" id="gin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="' + L("answer") + '">' + esc(parts[1]) + "</p>";
    if (it.h) h += '<span class="hint">(' + esc(it.h) + ")</span>";
    h += keysRow();
  } else if (it.t === "mc") {
    h += '<p class="q">' + esc(it.q).replace("___", '<span class="blank">&nbsp;</span>') + "</p>";
    if (it.h) h += '<span class="hint">(' + esc(it.h) + ")</span>";
    if (!session.opts) session.opts = shuffle(it.o);
    h += '<div class="opts">' + session.opts.map((o, i) => '<button class="opt" data-o="' + i + '">' + esc(o) + "</button>").join("") + "</div>";
  } else if (it.t === "sb") {
    if (!session.sb) {
      const end = (it.s.match(/[.?!]$/) || ["."])[0];
      let toks = it.s.replace(/[.?!]$/, "").split(/\s+/);
      if (!it.cap) toks[0] = toks[0].charAt(0).toLowerCase() + toks[0].slice(1);
      let order = shuffle(toks.map((_, i) => i));
      if (order.every((v, i) => v === i) && toks.length > 1) order = order.reverse();
      session.sb = { toks, order, built: [], end };
    }
    h += '<div class="build empty" id="build" data-ph="' + esc(L("sbPh")) + '"></div><div class="row" style="margin-top:6px"><span class="hint">' + L("sbEnd") + esc(session.sb.end) + '</span><button class="linkbtn" id="clr">' + L("reset") + "</button></div>";
    h += '<div class="pool" id="pool"></div>';
  } else {
    h += '<div class="src">' + esc(it.q) + "</div><div class=\"task\">" + esc(trTask(it.task)) + "</div>";
    h += '<textarea class="uf" id="uin" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="' + esc(L("ufPh")) + '" aria-label="' + L("answer") + '"></textarea>';
    h += keysRow();
  }
  h += '<div id="fb"></div></div>';
  const prevIn = document.getElementById("gin") || document.getElementById("uin");
  const prevVal = !fresh && prevIn ? prevIn.value : "";
  $app.innerHTML = h;
  if (it.t !== "mc") setCTA('<button class="btn btn-primary" id="check">' + L("check") + '</button>');
  wireItem(entry, r, it, fresh);
  const inp = document.getElementById("gin") || document.getElementById("uin");
  if (inp && prevVal) inp.value = prevVal;
  if (session.answered && session.fb) {
    if (inp) { inp.value = session.fb.given; inp.disabled = true; }
    if (it.t === "mc") $app.querySelectorAll("[data-o]").forEach(x => {
      x.disabled = true; const val = session.opts[+x.dataset.o];
      if (val === it.o[0]) x.classList.add("right"); else if (val === session.fb.given) x.classList.add("wrong");
    });
    drawFb(entry, it, session.fb.res, session.fb.given, true);
  }
}
function keysRow(){ return '<div class="keys">' + ["ä", "ö", "ü", "ß"].map(c => '<button data-k="' + c + '" type="button">' + c + "</button>").join("") + "</div>"; }
function wireItem(entry, r, it, fresh){
  const check = document.getElementById("check");
  const input = document.getElementById("gin") || document.getElementById("uin");
  $app.querySelectorAll("[data-k]").forEach(b => {
    b.addEventListener("mousedown", e => e.preventDefault());
    b.onclick = () => {
      if (!input || session.answered) return;
      const s = input.selectionStart ?? input.value.length, e2 = input.selectionEnd ?? input.value.length;
      input.value = input.value.slice(0, s) + b.dataset.k + input.value.slice(e2);
      input.focus(); try { input.setSelectionRange(s + 1, s + 1); } catch (e) {}
    };
  });
  if (input) {
    if (fresh) setTimeout(() => { try { input.focus({ preventScroll: true }); } catch (e) {} }, 60);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); session.answered ? next() : check.click(); }
    });
  }
  if (it.t === "gap") check.onclick = () => {
    const res = checkText(input.value, it.a, false);
    if (res.empty) return input.focus();
    input.disabled = true;
    finish(entry, r, it, res, input.value.trim());
  };
  if (it.t === "uf") check.onclick = () => {
    const res = checkText(input.value, it.a, true);
    if (res.empty) return input.focus();
    input.disabled = true;
    finish(entry, r, it, res, input.value.trim());
  };
  if (it.t === "mc") $app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
    if (session.answered) return;
    const chosen = session.opts[+b.dataset.o];
    const ok = chosen === it.o[0];
    $app.querySelectorAll("[data-o]").forEach(x => {
      x.disabled = true;
      const val = session.opts[+x.dataset.o];
      if (val === it.o[0]) x.classList.add("right");
      else if (x === b) x.classList.add("wrong");
    });
    finish(entry, r, it, { ok }, chosen);
  });
  if (it.t === "sb") {
    const $b = document.getElementById("build"), $p = document.getElementById("pool");
    const sb = session.sb;
    function draw(){
      $b.classList.toggle("empty", !sb.built.length);
      $b.innerHTML = sb.built.map((ti, pos) => '<button class="tok' + (sb.toks[ti] === "," ? " comma" : "") + '" data-bpos="' + pos + '">' + esc(sb.toks[ti]) + "</button>").join("");
      const used = new Set(sb.built);
      $p.innerHTML = sb.order.filter(ti => !used.has(ti)).map(ti => '<button class="tok' + (sb.toks[ti] === "," ? " comma" : "") + '" data-ti="' + ti + '">' + esc(sb.toks[ti]) + "</button>").join("");
      $p.querySelectorAll("[data-ti]").forEach(x => x.onclick = () => { if (session.answered) return; sb.built.push(+x.dataset.ti); draw(); });
      $b.querySelectorAll("[data-bpos]").forEach(x => x.onclick = () => { if (session.answered) return; sb.built.splice(+x.dataset.bpos, 1); draw(); });
      check.disabled = sb.built.length !== sb.toks.length;
    }
    document.getElementById("clr").onclick = () => { if (session.answered) return; sb.built = []; draw(); };
    draw();
    check.onclick = () => {
      if (sb.built.length !== sb.toks.length) return;
      const built = cleanSb(sb.built.map(ti => sb.toks[ti]).join(" "));
      const targets = [it.s].concat(it.alt || []).map(x => cleanSb(x).replace(/[.?!]$/, "").toLowerCase());
      const ok = targets.includes(built.toLowerCase());
      finish(entry, r, it, { ok }, cap1(built) + sb.end);
    };
  }
}
function finish(entry, r, it, res, given){
  session.answered = true;
  const full = fullSentence(it);
  if (!entry.retry) {
    record(entry.k, res.ok);
    session.done++;
    if (res.ok) session.correct++;
    else session.missed.push(entry.k);
  }
  if (!res.ok && entry.retry < 3) {
    const at = Math.min(session.queue.length, session.pos + 4);
    session.queue.splice(at, 0, { k: entry.k, retry: entry.retry + 1 });
  }
  session.fb = { res, given };
  drawFb(entry, it, res, given, false);
}
function drawFb(entry, it, res, given, redraw){
  const full = fullSentence(it);
  if (res.almost) res.tip = L("tipUml");
  else if (res.ok && res.tip) res.tip = L("tipComma");
  const cls = res.ok ? "ok" : (res.almost ? "almost" : "no");
  const head = res.ok ? (entry.retry ? L("nowRight") : L("right")) : (res.almost ? L("almost") : L("wrong"));
  let correctTxt = full;
  if (it.t === "gap") correctTxt = it.q.replace("___", "[" + it.a[0] + "]");
  let h = '<div class="fb ' + cls + ' fade"><h3>' + head + "</h3>";
  h += '<div class="ans"><div>' + esc(correctTxt).replace(/\[([^\]]+)\]/, "<b>$1</b>") + "</div>" + speakBtn(full) + "</div>";
  if (!res.ok && given) h += '<div class="yours">' + L("yours") + '<s>' + esc(given) + "</s></div>";
  if (res.ok && it.t === "uf" && it.a.length > 1 && norm(given, false) !== norm(it.a[0], false)) h += '<div class="yours">' + L("alsoRight") + esc(it.a[0]) + "</div>";
  if (res.tip) h += '<div class="tip">' + esc(res.tip) + "</div>";
  h += '<div class="why">' + esc(it.why) + '</div><div class="en">' + esc(it.en) + "</div></div>";
  document.getElementById("fb").innerHTML = h;
  bindSay(document.getElementById("fb"));
  const pct = Math.round(100 * session.done / session.total);
  const bar = $top.querySelector(".prog i"); if (bar) bar.style.width = pct + "%";
  setCTA('<button class="btn btn-primary" id="nextBtn">' + L("next") + '</button>');
  const nb = document.getElementById("nextBtn");
  nb.onclick = next;
  if (redraw) return;
  if (state.settings.autoSpeak) speak(full);
  setTimeout(() => {
    const fb = document.getElementById("fb");
    if (fb && fb.getBoundingClientRect().bottom > window.innerHeight - 90) fb.scrollIntoView({ behavior: "smooth", block: "end" });
    if (it.t === "mc" || it.t === "sb") try { nb.focus({ preventScroll: true }); } catch (e) {}
  }, 50);
}
function next(){ if (!session) return; session.pos++; renderSession(); }
document.addEventListener("keydown", e => {
  if (view.name === "session" && session && session.answered && e.key === "Enter" && !(e.target && e.target.id === "uin") && !(e.target && e.target.id === "gin")) { e.preventDefault(); next(); }
});

/* ---------- results ---------- */
function renderResults(){
  if (!session) return go({ name: "home" }, true);
  topBar(L("result"), esc(sessLabel(session.label)), "");
  const s = session, pct = s.done ? Math.round(100 * s.correct / s.done) : 0;
  let h = '<div class="card fade" style="text-align:center"><div class="res-big">' + s.correct + " / " + s.done + '</div><div style="color:var(--ink-2);margin-top:6px">' + L("firstTry", pct) + "</div></div>";
  const missed = Array.from(new Set(s.missed));
  if (missed.length) {
    h += '<div class="sec">' + L("review") + '</div><div class="card">' + missed.map(k => { const { r, it } = itemOf(k); return '<div class="miss"><div class="a">' + esc(fullSentence(it)) + '</div><div class="w">' + esc(r.title) + " · " + esc(it.why) + "</div></div>"; }).join("") + "</div>";
  } else if (s.done) h += '<p class="empty-note">' + L("noMiss") + '</p>';
  h += '<div class="actions">' + (missed.length ? '<button class="btn btn-primary" id="again">' + L("missAgain") + '</button>' : "") + '<button class="btn btn-line" id="home">' + L("toHome") + '</button></div>';
  $app.innerHTML = h;
  const again = document.getElementById("again");
  if (again) again.onclick = () => startSession(shuffle(missed), "#lblAgain");
  document.getElementById("home").onclick = () => { session = null; go({ name: "home" }); };
}

/* ---------- settings ---------- */
function renderSettings(){
  topBar(L("settings"), "", backBtn());
  bindBack();
  const tts = ttsAvailable();
  let h = '<div class="card"><div class="toggle"><div>' + L("langT") + '<small>' + L("langS") + '</small></div></div><div class="seg" style="margin-bottom:8px">' + [["de", "Deutsch"], ["en", "English"]].map(t => '<button data-lg="' + t[0] + '" class="' + (lang() === t[0] ? "on" : "") + '">' + t[1] + "</button>").join("") + "</div>";
  h += '<div class="toggle"><div>' + L("readAloud") + '<small>' + (tts ? L("readOn") : L("readOff")) + '</small></div><label class="sw"><input type="checkbox" id="auto"' + (state.settings.autoSpeak && tts ? " checked" : "") + (tts ? "" : " disabled") + "><span></span></label></div>";
  h += '<div class="toggle"><div>' + L("theme") + '<small>' + L("themeS") + '</small></div></div><div class="seg" id="theme">' + [["auto", L("thAuto")], ["light", L("thLight")], ["dark", L("thDark")]].map(t => '<button data-th="' + t[0] + '" class="' + (state.settings.theme === t[0] ? "on" : "") + '">' + t[1] + "</button>").join("") + "</div></div>";
  h += '<div class="card"><div class="toggle"><div>' + L("resetT") + '<small>' + L("resetS") + '</small></div></div><button class="btn btn-line" id="reset" style="color:var(--bad)">' + L("reset") + '</button></div>';
  if (!storageOK) h += '<div class="warn">' + L("noSave") + '</div>';
  $app.innerHTML = '<div class="fade">' + h + "</div>";
  const a = document.getElementById("auto");
  if (a) a.onchange = () => { state.settings.autoSpeak = a.checked; saveState(); if (a.checked) speak("Gut gemacht!"); };
  $app.querySelectorAll("[data-lg]").forEach(b => b.onclick = () => { state.settings.lang = b.dataset.lg; saveState(); document.documentElement.lang = lang(); render(true); });
  $app.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { state.settings.theme = b.dataset.th; saveState(); applyTheme(); $app.querySelectorAll("[data-th]").forEach(x => x.classList.toggle("on", x === b)); });
  document.getElementById("reset").onclick = () => {
    if (!confirm(L("resetAsk"))) return;
    state.box = {}; state.miss = {}; state.seen = {}; saveState(); go({ name: "home" });
  };
}

/* ---------- boot ---------- */
loadState();
/* inside the B1 app: follow its DE/EN switch */
try { const q = new URLSearchParams(location.search).get("lang"); if (q === "en" || q === "de") { state.settings.lang = q; document.documentElement.lang = q; } } catch (e) {}
applyTheme();
document.documentElement.lang = lang();
try { history.replaceState({ name: "home" }, ""); } catch (e) {}
render();
/* built into the B1 app: its service worker caches this page */
// test hook
window.__a2 = { RULES: ALL_RULES, checkText, norm, state: () => state, cur: () => session && session.queue[session.pos], trTask, L };
})();
</script>
