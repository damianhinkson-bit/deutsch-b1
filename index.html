<style>
/* Layout: one-column phone app — sticky header, content card stack, fixed tab bar. Same system as Deutsch A1. */
:root{

}

  --petrol:#2a8a90; --petrol-soft:#56b3b8; --on-petrol:#ffffff;
  --amber:#f2a33a; --amber-ink:#2b1a02; --amber-tint:#3a2c12;
  --good:#4cc08c; --good-tint:#133a2a; --bad:#ef7a6c; --bad-tint:#43201c;
  --der:#6aa8e6; --die:#ec7f90; --das:#62c48d;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a2124; --surface:#0f2e33; --surface-2:#153a40; --ink:#e4efed; --muted:#93b0ad; --line:#21464c;
  --petrol:#2a8a90; --petrol-soft:#56b3b8; --on-petrol:#ffffff;
  --amber:#f2a33a; --amber-ink:#2b1a02; --amber-tint:#3a2c12;
  --good:#4cc08c; --good-tint:#133a2a; --bad:#ef7a6c; --bad-tint:#43201c;
  --der:#6aa8e6; --die:#ec7f90; --das:#62c48d;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px}
.app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:56px}
.hdr .back{color:var(--petrol-soft);font-weight:700;font-size:15px;padding:6px 8px 6px 2px}
.hdr h1{font-size:19px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.hdr .right{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.view{padding-block:4px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.tabs-in{display:flex;width:100%;max-width:600px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:11.5px;font-weight:700}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--petrol-soft)}
.tab[aria-current="page"] svg{stroke:var(--amber)}
.warn{background:var(--bad-tint);border-radius:var(--r-md);padding:10px 14px;font-size:14px;margin:6px 0 10px}
.note{background:var(--amber-tint);border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin:12px 0}
.muted{color:var(--muted)} .small{font-size:13.5px}
.date{color:var(--muted);font-weight:600;font-size:15px;padding-top:8px}
.big{display:flex;align-items:flex-end;gap:14px;margin:4px 0 2px}
.big .n{font-size:88px;line-height:.86;font-weight:800;letter-spacing:-.05em;color:var(--petrol-soft);font-variant-numeric:tabular-nums}
.big .n.zero{color:var(--good)}
.big .l{font-size:18px;font-weight:700;line-height:1.2;padding-bottom:6px}
.hero{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--petrol);color:var(--on-petrol);border-radius:var(--r-lg);padding:18px;margin:10px 0 0}
.hero.alt{background:var(--amber);color:var(--amber-ink)}
.hero[disabled]{opacity:.5;cursor:default}
.hero .ic{font-size:28px;font-weight:800;width:44px;text-align:center;font-variant-numeric:tabular-nums}
.hero .tt{font-weight:800;font-size:18px;display:block}
.hero .ss{opacity:.85;font-size:14px;display:block}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.strip div{background:var(--surface);border-radius:var(--r-md);padding:12px;box-shadow:var(--shadow);min-width:0}
.strip b{display:block;font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.strip span{color:var(--muted);font-size:12.5px;font-weight:600}
.h2{font-size:15px;font-weight:800;margin:24px 2px 8px;color:var(--muted)}
.row-sw{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r-md);padding:13px 14px;box-shadow:var(--shadow);margin-top:12px;width:100%;text-align:left}
.row-sw .tx{flex:1;min-width:0}
.row-sw b{display:block;font-size:15.5px}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--amber)} .sw.on i{left:23px}
.meter{padding:8px 2px;display:block;width:100%;text-align:left}
.pick-l{font-size:13px;font-weight:800;color:var(--muted);margin:14px 2px 6px}
.today-tag{font-style:normal;font-size:11px;font-weight:800;background:var(--amber);color:#1b1300;border-radius:99px;padding:1px 7px;margin-left:8px;vertical-align:2px}
.meter .top{align-items:baseline}.meter .top span{margin-left:auto}
.meter-ed{display:flex;align-items:center;gap:8px}.meter-ed .meter{flex:1;min-width:0}
.mv,.mv-ph{display:flex;gap:6px;flex:none;width:94px}
.mv button{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:20px;font-weight:800;color:var(--ink)}
.mv button:disabled{opacity:.3}
.meter .top{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15px}
.meter .top span{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--good)} .bar .s{background:var(--petrol-soft)}
.menu{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin:10px 0}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .ic{width:40px;height:40px;flex:0 0 auto;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;color:var(--petrol-soft);font-size:14px}
.item .tx{flex:1;min-width:0} .item .tt{font-weight:700;font-size:16px;display:block} .item .ss{color:var(--muted);font-size:13.5px;display:block}
.item[disabled]{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:7px 13px;font-weight:700;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--petrol);border-color:var(--petrol);color:var(--on-petrol)}
.stats{display:flex;gap:8px;margin:4px 0 12px}
.stats div{flex:1;background:var(--surface);border-radius:12px;padding:8px;text-align:center;box-shadow:var(--shadow)}
.stats b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:11.5px;color:var(--muted);font-weight:700}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:24px 18px;text-align:center;position:relative}
.card .mode{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card .w{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:10px 0 4px;overflow-wrap:anywhere}
.card .w.sm{font-size:27px}
.card .en{font-size:20px;font-weight:700;margin:10px 0 2px}
.card .meta{color:var(--muted);font-size:14.5px}
.card .spk{position:absolute;top:12px;right:12px}
.art-der{color:var(--der)} .art-die{color:var(--die)} .art-das{color:var(--das)}
.ex{margin-top:14px;padding:12px 14px;background:var(--bg);border-radius:14px;text-align:left}
.ex .de{font-weight:700;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.ex .tr{color:var(--muted);font-size:14px;margin-top:3px}
.ex mark{background:var(--amber-tint);color:inherit;border-radius:4px;padding:0 2px}
.spk{width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--petrol-soft);display:inline-grid;place-items:center;flex:0 0 auto}
.spk svg,.say svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bigspk{width:96px;height:96px;border-radius:50%;background:var(--petrol);color:#fff;display:grid;place-items:center;margin:16px auto 6px}
.bigspk svg{width:42px;height:42px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:13px 15px;font-weight:600;font-size:16px}
.opt.ok{border-color:var(--good);background:var(--good-tint)} .opt.no{border-color:var(--bad);background:var(--bad-tint)} .opt.dim{opacity:.5}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.arts button{padding:18px 0;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);font-size:21px;font-weight:800}
.arts button.ok{background:var(--good);border-color:var(--good);color:#fff} .arts button.no{background:var(--bad);border-color:var(--bad);color:#fff}
.inp{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;font-size:19px;font-weight:700;outline:none;margin-top:14px;text-align:center}
.inp:focus{border-color:var(--petrol-soft)} .inp.ok{border-color:var(--good);background:var(--good-tint)} .inp.no{border-color:var(--bad);background:var(--bad-tint)}
.uml{display:flex;gap:8px;justify-content:center;margin-top:10px}
.uml button{width:46px;height:42px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;font-size:18px}
.fb{margin-top:14px;border-left:3px solid var(--amber);background:var(--surface);border-radius:0 12px 12px 0;padding:12px 14px;font-size:15px;text-align:left}
.fb.good{border-left-color:var(--good)} .fb.bad{border-left-color:var(--bad)}
.fb b{font-weight:800}
.btn{display:block;width:100%;border-radius:var(--r-md);padding:15px;font-weight:800;font-size:16px;text-align:center;margin-top:14px}
.btn.primary{background:var(--amber);color:var(--amber-ink)} .btn.petrol{background:var(--petrol);color:var(--on-petrol)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)} .btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;gap:10px;margin-top:14px} .row2 .btn{margin-top:0}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:2px 0 12px} .prog i{display:block;height:100%;background:var(--amber);transition:width .3s}
.result{text-align:center;padding:16px 0 4px}
.result .pct{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--petrol-soft)}
.result .lbl{font-weight:700;font-size:18px;margin-top:6px}
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .tx{flex:1;min-width:0} .li .d{font-weight:700;display:block;overflow-wrap:anywhere} .li .e{color:var(--muted);font-size:13.5px;display:block}
.lv{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.lv.l4,.lv.l5{background:var(--good-tint);color:var(--good)} .lv.l1,.lv.l2,.lv.l3{background:var(--amber-tint);color:var(--ink)}
.search{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px;font-size:16px;outline:none;margin:4px 0 10px}
.ta{width:100%;min-height:110px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px;font-size:13px;font-family:ui-monospace,monospace}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;max-width:90vw}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pairs .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.pc{min-height:56px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.pc.de{font-weight:800}
.pc.sel{border-color:var(--amber);background:var(--amber-tint)}
.pc.ok{border-color:var(--good);background:var(--good-tint);opacity:.6}
.pc.no{border-color:var(--bad);background:var(--bad-tint);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tts-note{background:var(--amber-tint);border-radius:var(--r-md);padding:10px 14px;font-size:14px;margin:8px 0 4px}
.ctl{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:13px 14px;margin:14px 0 6px;display:flex;flex-direction:column;gap:10px}
.ctl-t b{display:block;font-size:15.5px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--petrol);color:var(--on-petrol)}
.langbtn{display:flex;gap:2px;background:var(--surface-2);border-radius:10px;padding:3px;flex:0 0 auto}
.langbtn b{font-size:12px;font-weight:800;padding:4px 7px;border-radius:7px;color:var(--muted)}
.langbtn b.on{background:var(--petrol);color:var(--on-petrol)}
.hero.ghosty{background:var(--surface);color:var(--ink);border:1.5px solid var(--petrol-soft)}
.hero.ghosty .ic{color:var(--petrol-soft)}
.lvlbtn{display:flex;gap:2px;background:var(--surface-2);border-radius:10px;padding:3px;flex:0 0 auto}
.lvlbtn b{font-size:12.5px;font-weight:800;padding:4px 8px;border-radius:7px;color:var(--muted);cursor:pointer}
.lvlbtn b.on{background:var(--amber);color:var(--amber-ink)}
.lv.miss{background:var(--bad-tint);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.study .cnt{color:var(--muted);font-weight:700;font-size:14px;text-align:center;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

,"Züge","","","train","verkehr","Ich fahre gern mit dem Zug.","I like travelling by train.",0,"A1"],[10785,"o","","zurück","","","","back","verkehr","Einmal Frankfurt und zurück.","A return to Frankfurt.",0,"A1"],[10786,"o","","zusammen","","","","together","klein","Sollen wir zusammen essen gehen?","Shall we go out to eat together?",0,"A1"],[10787,"o","","zwischen","","","","between","klein","Heidelberg liegt zwischen Frankfurt und Stuttgart.","Heidelberg is between Frankfurt and Stuttgart.",0,"A1"]];
const THEMES_DE = {zahl:"Zahlen & Maße",zeit:"Zeit & Datum",farbe:"Farben",land:"Länder & Herkunft",amt:"Ämter & Formulare",wohn:"Wohnen & Haushalt",arbeit:"Arbeit & Beruf",geld:"Geld & Einkaufen",gesund:"Gesundheit & Körper",verkehr:"Verkehr & Reisen",essen:"Essen & Trinken",komm:"Kommunikation & Medien",mensch:"Menschen & Gefühle",tun:"Verben im Alltag",klein:"Kleine Wörter",lernen:"Schule & Lernen",freizeit:"Freizeit & Kultur",natur:"Natur & Umwelt",gesell:"Gesellschaft & Recht",wie:"Beschreiben"};
const THEMES_EN = {zahl:"Numbers & measures",zeit:"Time & dates",farbe:"Colours",land:"Countries & origin",amt:"Offices & forms",wohn:"Home & household",arbeit:"Work & jobs",geld:"Money & shopping",gesund:"Health & body",verkehr:"Transport & travel",essen:"Food & drink",komm:"Communication & media",mensch:"People & feelings",tun:"Everyday verbs",klein:"Small words",lernen:"School & learning",freizeit:"Leisure & culture",natur:"Nature & environment",gesell:"Society & law",wie:"Describing"};
const ORDER = ["zahl","zeit","farbe","land","amt","wohn","arbeit","geld","gesund","verkehr","essen","komm","mensch","tun","lernen","freizeit","natur","gesell","wie"];
const PER_DAY = 60, PACK = 10;
const INTERVAL = [0,1,3,7,16,35];
const W = RAW.map(r=>({id:r[0],pos:r[1],art:r[2],de:r[3],pl:r[4],fem:r[5],conj:r[6],en:r[7],t:r[8],ex:r[9],exEn:r[10],plOnly:!!r[11],lvl:r[12]}));
const LEVELS=["A1","A2","B1"];
const BY = {}; W.forEach(w=>BY[w.id]=w);

/* Daily order: themed words in life-in-Germany order, with the small words spread evenly through every day. */
function buildSeq(WL,order){
  const main=[]; (order||ORDER).forEach(t=>WL.filter(w=>w.t===t).forEach(w=>main.push(w.id)));
  const small=WL.filter(w=>w.t==="klein").map(w=>w.id);
  const out=[]; let i=0,j=0; const ratio=small.length/WL.length;
  while(i<main.length||j<small.length){
    const n=out.length+1;
    if(j<small.length && (i>=main.length || (j+1)/n <= ratio)) out.push(small[j++]); else out.push(main[i++]);
  }
  return out;
}

/* ---------- storage (guarded) ---------- */
const KEY="b1-wortschatz-v1";
const FRESH=()=>({cards:{},days:{},pause:false,streak:{last:"",n:0},miss:{},missLvl:1,lang:"de",level:"B1",pick:{},order:{}});
let DB=FRESH(), persistOK=true;
try{const raw=localStorage.getItem(KEY); if(raw){DB=Object.assign(FRESH(),JSON.parse(raw));} localStorage.setItem(KEY+"-t","1"); localStorage.removeItem(KEY+"-t");}catch(e){persistOK=false;}
function migrate(){ if(DB.pm){ for(const k in DB.pm) DB.miss[k]=(DB.miss[k]||0)+DB.pm[k]; delete DB.pm; } if(DB.focusMiss===false){ DB.missLvl=0; } delete DB.focusMiss; if(!DB.miss) DB.miss={}; if(DB.missLvl==null) DB.missLvl=1; if(!DB.lang) DB.lang="de"; if(!DB.pick) DB.pick={}; if(!DB.order) DB.order={}; if(!LEVELS.includes(DB.level)) DB.level="B1"; const first=Object.keys(DB.days||{}).sort()[0]||today(); for(const k in DB.cards){ if(!DB.cards[k].d) DB.cards[k].d=first; } }
migrate();

/* ---------- theme order and today's theme (per level, your choice) ---------- */
function themeOrder(l){ const c=(DB.order[l]||[]).filter(t=>ORDER.includes(t)); return c.concat(ORDER.filter(t=>!c.includes(t))); }
const SEQS={}; function rebuildSeq(l){ SEQS[l]=buildSeq(W.filter(w=>w.lvl===l),themeOrder(l)); }
LEVELS.forEach(rebuildSeq);
function moveTheme(t,dir){ const o=levelThemes().filter(x=>x!=="klein"); const i=o.indexOf(t), j=i+dir; if(i<0||j<0||j>=o.length) return; [o[i],o[j]]=[o[j],o[i]]; DB.order[DB.level]=o; rebuildSeq(DB.level); save(); }
function resetOrder(){ delete DB.order[DB.level]; rebuildSeq(DB.level); save(); }
const PICK=()=>{ const p=DB.pick[DB.level]; return p&&themeLeft(p)>0?p:""; };
function themeLeft(t){ let n=0; for(const w of W) if(w.lvl===DB.level&&w.t===t&&!DB.cards[w.id]) n++; return n; }
function save(){ if(!persistOK) return; try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){persistOK=false;} }

/* ---------- interface language (the words you learn always stay German) ---------- */
const EN=()=>DB.lang==="en";
const L=(de,en)=>EN()?en:de;
const THEME=t=>(EN()?THEMES_EN:THEMES_DE)[t];

/* ---------- level ---------- */
const LV=()=>DB.level;
const LW=()=>W.filter(w=>w.lvl===DB.level);
function setLevel(l){ DB.level=l; save(); }

/* ---------- dates ---------- */
function dstr(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function today(){return dstr(new Date());}
function addDays(s,n){const [y,m,d]=s.split("-").map(Number);const x=new Date(y,m-1,d);x.setDate(x.getDate()+n);return dstr(x);}

/* ---------- SRS ---------- */
function dueIds(){const t=today();return Object.keys(DB.cards).filter(id=>DB.cards[id].due<=t).map(Number).sort((a,b)=>DB.cards[a].due<DB.cards[b].due?-1:1);}
function newToday(){return DB.days[today()]||0;}
function newLeft(){return DB.pause?0:Math.max(0,PER_DAY-newToday());}
function nextNew(n){
  const out=[], p=PICK(), seq=SEQS[DB.level];
  if(p) for(const id of seq){ if(!DB.cards[id]&&BY[id].t===p){ out.push(id); if(out.length>=n) return out; } }
  for(const id of seq){ if(!DB.cards[id]&&!out.includes(id)){ out.push(id); if(out.length>=n) break; } }
  return out;
}
function introduce(id){ if(DB.cards[id]) return; DB.cards[id]={lv:0,due:today(),seen:1,ok:0,bad:0,d:today()}; DB.days[today()]=(DB.days[today()]||0)+1; }
function grade(id,okFirst){
  const c=DB.cards[id]; if(!c) return;
  if(okFirst){ c.lv=Math.min(5,c.lv+1); c.ok++; } else { c.lv=c.lv>2?1:Math.max(0,c.lv-1); c.bad++; }
  c.due = c.lv===0 ? today() : addDays(today(), INTERVAL[Math.max(1,c.lv)]);
  touchStreak(); save();
}
function touchStreak(){const t=today(); if(DB.streak.last===t) return; DB.streak.n = DB.streak.last===addDays(t,-1) ? DB.streak.n+1 : 1; DB.streak.last=t;}
function introducedSince(day){ return Object.keys(DB.cards).filter(id=>DB.cards[id].d>=day&&BY[id]&&BY[id].lvl===DB.level).map(Number); }
function counts(){let started=0,mastered=0;for(const id in DB.cards){ if(!BY[id]||BY[id].lvl!==DB.level) continue; started++; if(DB.cards[id].lv>=4) mastered++;}return {started,mastered};}

/* ---------- mistakes: remembered in every mode ---------- */
function missUp(id){ DB.miss[id]=Math.min(6,(DB.miss[id]||0)+1); save(); }
function missDown(id){ if(DB.miss[id]){ DB.miss[id]--; if(!DB.miss[id]) delete DB.miss[id]; save(); } }
const MISS_CAP=[0,.25,.5];
/* Pick n words: past mistakes fill at most 25% (Etwas) or 50% (Stark), the rest is random. */
function pickSet(pool,n){
  const cap=MISS_CAP[DB.missLvl]||0;
  if(!cap) return shuffle(pool).slice(0,n);
  const missed=shuffle(pool.filter(id=>DB.miss[id])).sort((a,b)=>DB.miss[b]-DB.miss[a]);
  const k=Math.min(missed.length,Math.floor(n*cap));
  const chosen=new Set(missed.slice(0,k));
  for(const id of shuffle(pool)){ if(chosen.size>=n) break; chosen.add(id); }
  return shuffle([...chosen]);
}
function missLevelCtl(){
  const lv=DB.missLvl;
  const names=[L("Aus","Off"),L("Etwas","Some"),L("Stark","Lots")];
  const hint=[L("Alles zufällig.","Everything random."),L("Höchstens 1 von 4 Wörtern ist ein alter Fehler.","At most 1 in 4 words is a past mistake."),L("Höchstens die Hälfte sind alte Fehler.","At most half are past mistakes.")][lv];
  return `<div class="ctl"><div class="ctl-t"><b>${L("Fehler öfter zeigen","Repeat mistakes")}</b><span class="muted small">${hint} ${L("Gilt für Üben und Paare.","Applies to practice and pairs.")}</span></div><div class="seg" role="group">${names.map((nm,i)=>`<button data-ml="${i}" aria-pressed="${lv===i}">${nm}</button>`).join("")}</div></div>`;
}
function bindMissLevel(rerender){ document.querySelectorAll("[data-ml]").forEach(b=>b.onclick=()=>{ DB.missLvl=+b.dataset.ml; save(); rerender(); }); }
function missCount(){ return Object.keys(DB.miss).length; }

/* ---------- speech (guarded) ---------- */
let deVoice=null;
function getSynth(){try{return (typeof window!=="undefined"&&window.speechSynthesis)?window.speechSynthesis:null;}catch(e){return null;}}
function loadVoices(){const s=getSynth();if(!s)return;try{const v=s.getVoices()||[];deVoice=v.find(x=>/^de[-_]DE/i.test(x.lang))||v.find(x=>/^de/i.test(x.lang))||null;}catch(e){}}
(function(){const s=getSynth();if(s){loadVoices();try{s.onvoiceschanged=loadVoices;}catch(e){}}})();
const TTS = !!getSynth() && typeof SpeechSynthesisUtterance!=="undefined";
function say(text,rate){const s=getSynth();if(!s||!text)return false;try{if(s.speaking||s.pending)s.cancel();if(!deVoice)loadVoices();const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";if(deVoice)u.voice=deVoice;u.rate=rate||.9;u.volume=1;try{s.resume();}catch(e){}s.speak(u);return true;}catch(e){return false;}}
function autoSay(t){ if(DB.autoSay!==false) say(t); }
function hush(){const s=getSynth();if(s)try{s.cancel();}catch(e){}}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const ICON={spk:'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>'};
function full(w){return (w.art?w.art+" ":"")+w.de;}
function artCls(w){return w.art&&!w.art.includes("/")?"art-"+w.art:"";}
function head(w){ return w.art ? `<span class="${artCls(w)}">${esc(w.art)}</span> ${esc(w.de)}` : esc(w.de); }
function metaLine(w){
  if(w.pos==="n"){const bits=[]; if(w.plOnly) bits.push(L("nur Plural","plural only")); else bits.push(w.pl?"Pl. die "+w.pl:L("kein Plural","no plural")); if(w.fem) bits.push(w.fem); return bits.join(" · ");}
  if(w.pos==="v") return w.conj||"";
  return "";
}
function markWord(ex,w){
  const stem=w.de.replace(/^\(?sich\)?\s+/,"").split(/[\s/,(]/)[0].replace(/-$/,"");
  if(stem.length<3) return esc(ex);
  const s=stem.slice(0,Math.max(3,Math.min(stem.length,stem.length-2))).toLowerCase();
  return esc(ex).split(" ").map(t=>t.toLowerCase().includes(s)?"<mark>"+t+"</mark>":t).join(" ");
}
function exBlock(w,showTr=true){
  if(!w.ex) return "";
  return `<div class="ex"><div class="de"><span>${markWord(w.ex,w)}</span>${TTS?`<button class="spk" data-say="${esc(w.ex)}" aria-label="${L("Satz anhören","Play sentence")}">${ICON.spk}</button>`:""}</div>${showTr?`<div class="tr">${esc(w.exEn)}</div>`:""}</div>`;
}
let toastT;function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);}

/* ---------- answer checking ---------- */
function norm(s){return s.toLowerCase().replace(/ß/g,"ss").replace(/[.,!?;:"„“'()]/g," ").replace(/\s+/g," ").trim();}
function deUml(s){return s.replace(/ae/g,"ä").replace(/oe/g,"ö").replace(/ue/g,"ü");}
function accepted(w){
  const forms=new Set(); const base=w.de.replace(/\s*\(.*?\)\s*/g," ").trim();
  const parts=base.split("/").map(x=>x.trim()).filter(Boolean);
  const noSich=s=>s.replace(/^sich\s+/,"");
  const add=s=>{forms.add(norm(s));forms.add(norm(noSich(s)));};
  const arts=(w.art||"").split("/");
  parts.forEach(p=>{ if(w.pos==="n"&&w.art){arts.forEach(a=>add(a+" "+p));} else add(p); });
  if(w.pos!=="n") add(w.de.replace(/[()]/g,""));
  return forms;
}
function check(w,input){
  const a=accepted(w); const n=norm(input);
  if(a.has(n)) return "ok";
  const nu=norm(deUml(input.toLowerCase())); if(a.has(nu)) return "uml";
  if(w.pos==="n"&&w.art){ const bare=norm(w.de.split("/")[0]); if(n===bare||nu===bare) return "noart"; const parts=n.split(" "); if(parts.length>1&&["der","die","das"].includes(parts[0])&&parts.slice(1).join(" ")===bare) return "wrongart"; }
  return "no";
}

/* ---------- modes ---------- */
const MODE=k=>({art:L("Artikel","Articles"),ver:L("Verstehen","Meaning"),sch:L("Schreiben","Writing"),hor:L("Hören","Listening"),paa:L("Paare","Pairs")})[k];
const MODE_KEYS=["art","ver","sch","hor","paa"];
function modesFor(w){const m=["ver","sch"]; if(w.pos==="n"&&w.art&&!w.art.includes("/")&&!w.plOnly) m.push("art"); if(TTS) m.push("hor"); return m;}
function pickMode(w,pref){const m=modesFor(w); if(pref&&pref!=="mix"&&pref!=="paa") return m.includes(pref)?pref:"ver"; return m[Math.floor(Math.random()*m.length)];}
function distractors(w,n=3){
  const used=new Set([w.en]); const pool=shuffle(W.filter(x=>x.id!==w.id&&x.pos===w.pos&&x.t===w.t)).concat(shuffle(W.filter(x=>x.id!==w.id&&x.pos===w.pos)));
  const out=[]; for(const x of pool){ if(used.has(x.en)) continue; used.add(x.en); out.push(x); if(out.length>=n) break; } return out;
}

/* ---------- QUIZ (reviews, new packs, practice) ---------- */
function startReview(){ const ids=dueIds(); if(!ids.length){home();return;} startQuiz(ids,"rev"); }
function quizTitle(kind){ return kind==="new"?L("Neue Wörter","New words"):kind==="rev"?L("Wiederholen","Review"):L("Üben","Practice"); }
function startQuiz(ids,kind,opt={}){
  session={kind,queue:ids.slice(),first:{},done:0,total:ids.length,right:0,srs:opt.srs!==false,pref:opt.mode||"mix"};
  if(kind==="new") session.queue=shuffle(session.queue);
  ask();
}
function ask(){
  const s=session; if(!s) return;
  if(!s.queue.length){ finish(); return; }
  const w=BY[s.queue[0]];
  if(!s.cur||s.cur.w!==w||s.cur.answered) s.cur={w,mode:pickMode(w,s.pref),answered:false};
  const mode=s.cur.mode;
  const pct=s.total?100*s.done/s.total:0;
  let inner="";
  if(mode==="art"){
    inner=`<div class="mode">${MODE("art")}</div><div class="w ${w.de.length>14?"sm":""}">___ ${esc(w.de)}</div><div class="meta">${esc(w.en)}</div>
     <div class="arts">${["der","die","das"].map(a=>`<button data-a="${a}" class="art-${a}">${a}</button>`).join("")}</div>`;
  } else if(mode==="ver"||mode==="hor"){
    if(!s.cur.opts) s.cur.opts=shuffle([w].concat(distractors(w)));
    const opts=s.cur.opts;
    inner = mode==="ver"
      ? `<div class="mode">${MODE("ver")}</div><div class="w ${full(w).length>18?"sm":""}">${head(w)}</div><div class="meta">${esc(metaLine(w))}</div>`
      : `<div class="mode">${MODE("hor")}</div><button class="bigspk" id="replay" aria-label="${L("Nochmal anhören","Play again")}">${ICON.spk}</button><div class="meta">${L("Tippen zum Wiederholen","Tap to hear it again")}</div>`;
    inner+=`<div class="opts">${opts.map((o,i)=>`<button class="opt" data-o="${i}">${esc(o.en)}</button>`).join("")}</div>`;
  } else {
    inner=`<div class="mode">${MODE("sch")}</div><div class="en" style="font-size:24px">${esc(w.en)}</div><div class="meta">${w.pos==="n"?L("mit Artikel","with article"):w.pos==="v"?L("Infinitiv","infinitive"):""}</div>
     <form id="f" autocomplete="off"><input class="inp" id="inp" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="${L("Deine Antwort","Your answer")}" placeholder="${L("auf Deutsch …","in German …")}">
     <div class="uml">${["ä","ö","ü","ß"].map(c=>`<button type="button" data-c="${c}">${c}</button>`).join("")}</div>
     <button class="btn petrol" id="chk" type="submit">${L("Prüfen","Check")}</button></form>`;
  }
  const body=`<div class="stats"><div><b>${s.queue.length}</b><span>${L("offen","left")}</span></div><div><b>${s.right}</b><span>${L("richtig","right")}</span></div><div><b>${s.done}</b><span>${L("fertig","done")}</span></div></div>
   <div class="prog"><i style="width:${pct}%"></i></div>
   <div class="card">${inner}</div><div id="after"></div>`;
  shell(quizTitle(s.kind),body,{back:s.srs?L("Heute","Today"):L("Üben","Practice"),backTo:s.srs?"home":"ueben",redraw:()=>{ if(!s.cur.answered) ask(); }});
  if(mode==="art") document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(b.dataset.a===w.art,b));
  if(mode==="ver"||mode==="hor") document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answer(s.cur.opts[+b.dataset.o].id===w.id,b));
  if(mode==="hor"){ setTimeout(()=>say(full(w)),150); $("#replay").onclick=()=>say(full(w)); }
  if(mode==="sch"){
    const inp=$("#inp"); setTimeout(()=>{try{inp.focus();}catch(e){}},60);
    document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+b.dataset.c+inp.value.slice(inp.selectionEnd??p);inp.focus();try{inp.setSelectionRange(p+1,p+1);}catch(e){}});
    $("#f").addEventListener("submit",e=>{e.preventDefault(); if(s.cur.answered) return; const r=check(w,inp.value); inp.disabled=true; inp.classList.add(r==="ok"||r==="uml"?"ok":"no"); answer(r==="ok"||r==="uml",null,r);});
  }
}
function answer(ok,btn,why){
  const s=session; const c=s.cur; if(c.answered) return; c.answered=true; const w=c.w;
  if(c.mode==="art"){ document.querySelectorAll("[data-a]").forEach(b=>{b.disabled=true;if(b.dataset.a===w.art)b.classList.add("ok");}); if(!ok&&btn)btn.classList.add("no"); }
  if(c.mode==="ver"||c.mode==="hor"){ document.querySelectorAll("[data-o]").forEach(b=>{b.disabled=true;const o=c.opts[+b.dataset.o];if(o.id===w.id)b.classList.add("ok");else if(b!==btn)b.classList.add("dim");}); if(!ok&&btn)btn.classList.add("no"); }
  const id=w.id; const isFirst=!(id in s.first); if(isFirst){ s.first[id]=ok; if(ok) missDown(id); else missUp(id); }
  let note="";
  if(why==="uml") note=" "+L("Tipp: mit Umlaut schreiben.","Tip: write it with the umlaut.");
  if(why==="noart") note=" "+L("Der Artikel fehlt.","The article is missing.");
  if(why==="wrongart") note=" "+L("Falscher Artikel.","Wrong article.");
  const fb=`<div class="fb ${ok?"good":"bad"}"><b>${ok?L("Richtig.","Correct."):L("Nicht ganz.","Not quite.")}</b>${esc(note)} <span class="${artCls(w)}" style="font-weight:800">${esc(full(w))}</span> = ${esc(w.en)}<div class="muted small">${esc(metaLine(w))}</div></div>${exBlock(w)}`;
  $("#after").innerHTML=fb+`<button class="btn primary" id="nx">${L("Weiter","Next")}</button>`;
  if(TTS&&c.mode!=="hor") autoSay(full(w));
  s.queue.shift();
  if(ok){ s.done++; if(s.first[id]) s.right++; if(s.srs) grade(id,s.first[id]); }
  else { const at=Math.min(s.queue.length,3+Math.floor(Math.random()*3)); s.queue.splice(at,0,id); }
  const nx=$("#nx"); nx.onclick=()=>ask(); setTimeout(()=>{try{nx.focus({preventScroll:true});}catch(e){}},30);
}
function finish(){
  const s=session; const pct=s.total?Math.round(100*s.right/s.total):0;
  const moreNew = s.kind==="new" && nextNew(1).length;
  const due=dueIds().length;
  const draw=()=>{
    const body=`<div class="result"><div class="pct">${pct}%</div><div class="lbl">${L("beim ersten Versuch richtig","right first time")}</div><p class="muted">${s.total} ${L("Wörter","words")} · ${s.right} ${L("sofort gewusst","known straight away")}</p></div>
     ${moreNew?`<button class="btn primary" id="more">${newLeft()>0?L(`Nächste ${Math.min(PACK,newLeft())} neue Wörter`,`Next ${Math.min(PACK,newLeft())} new words`):L(`Noch ${PACK} neue Wörter (über dem Tagesziel)`,`${PACK} more new words (beyond the daily goal)`)}</button>`:""}
     ${s.kind==="new"?`<button class="btn petrol" id="drill">${L("Heutige neue Wörter in allen Arten üben","Drill today's new words every way")}</button>`:""}
     ${s.srs&&due?`<button class="btn petrol" id="rev">${due} ${L("fällige Wiederholungen","reviews due")}</button>`:""}
     <button class="btn ghost" id="home">${s.srs?L("Zurück zu Heute","Back to Today"):L("Zurück zu Üben","Back to Practice")}</button>`;
    shell(quizTitle(s.kind),body,{redraw:draw});
    if(moreNew) $("#more").onclick=()=>startNew();
    const dr=$("#drill"); if(dr) dr.onclick=drillToday;
    if(s.srs&&due) $("#rev").onclick=()=>startReview();
    $("#home").onclick=()=>go(s.srs?"home":"ueben");
  };
  session=null; draw();
}

/* ---------- auto-speak switch ---------- */
function sayToggle(){ const on=DB.autoSay!==false; return `<button class="row-sw" id="saySw" aria-pressed="${on}" style="margin:0 0 10px"><span class="tx"><b>${L("Beim Tippen vorlesen","Read aloud when tapped")}</b><span class="muted small">${TTS?L("Deutsche Wörter automatisch vorlesen.","Read German words aloud automatically."):L("Ton geht nur in Chrome, nicht in der Claude-App.","Sound only works in Chrome, not in the Claude app.")}</span></span><span class="sw ${on?"on":""}"><i></i></span></button>`; }
function bindSayToggle(){ const b=$("#saySw"); if(!b) return; b.onclick=()=>{ DB.autoSay=(DB.autoSay===false); save(); const on=DB.autoSay!==false; b.setAttribute("aria-pressed",on); b.querySelector(".sw").classList.toggle("on",on); if(!on) hush(); toast(on?L("Vorlesen an","Read aloud on"):L("Vorlesen aus","Read aloud off")); }; }

/* ---------- PAARE (matching) ---------- */
function startPairs(ids,opt){
  const rounds=[]; const list=shuffle(ids); for(let i=0;i<list.length;i+=5) rounds.push(list.slice(i,i+5));
  session={kind:"pairs",rounds,r:0,miss:0,opt,missed:new Set(),extra:false,extraStart:0};
  pairRound();
}
function pairRound(){
  const s=session; const batch=s.rounds[s.r].map(id=>BY[id]);
  if(!s.order||s.order.r!==s.r) s.order={r:s.r,L:shuffle(batch),R:shuffle(batch),done:new Set()};
  const draw=()=>{
    const {L:Lc,R:Rc,done:D}=s.order;
    const body=`<p class="muted" style="margin:4px 2px 4px">${L("Tippe ein deutsches Wort, dann die passende Bedeutung.","Tap a German word, then its meaning.")}</p>
     <p class="muted small" style="margin:0 2px 8px">${s.extra&&s.r>=s.extraStart?L("Fehlerrunde","Mistakes round"):`${L("Runde","Round")} ${s.r+1} ${L("von","of")} ${s.rounds.length}`}</p>
     ${sayToggle()}
     <div class="pairs"><div class="col">${Lc.map(w=>`<button class="pc de ${D.has(w.id)?"ok":""}" data-id="${w.id}" data-s="L" ${D.has(w.id)?"disabled":""}>${head(w)}</button>`).join("")}</div>
     <div class="col">${Rc.map(w=>`<button class="pc ${D.has(w.id)?"ok":""}" data-id="${w.id}" data-s="R" ${D.has(w.id)?"disabled":""}>${esc(w.en)}</button>`).join("")}</div></div><div id="out"></div>`;
    shell(s.opt.title||MODE("paa"),body,{back:s.opt.backLabel||L("Heute","Today"),backTo:s.opt.backTo||"home",redraw:draw});
    bindSayToggle();
    if(D.size===batch.length) roundDone();
    let sel=null;
    document.querySelectorAll(".pc").forEach(b=>b.onclick=()=>{
      if(b.classList.contains("ok")) return;
      if(b.dataset.s==="L") autoSay(full(BY[+b.dataset.id]));
      if(!sel||sel.dataset.s===b.dataset.s){ if(sel) sel.classList.remove("sel"); sel=b; b.classList.add("sel"); return; }
      if(sel.dataset.id===b.dataset.id){ const mid=+b.dataset.id; if(!s.missed.has(mid)) missDown(mid); [sel,b].forEach(x=>{x.classList.remove("sel");x.classList.add("ok");x.disabled=true;}); sel=null; D.add(mid);
        if(D.size===batch.length) roundDone();
      } else { s.miss++; [sel,b].forEach(x=>{const id=+x.dataset.id; if(!s.missed.has(id)){missUp(id); s.missed.add(id);} }); const a=sel,c=b; [a,c].forEach(x=>{x.classList.remove("sel");x.classList.add("no");}); sel=null; setTimeout(()=>[a,c].forEach(x=>x.classList.remove("no")),350); }
    });
  };
  const roundDone=()=>{
    $("#out").innerHTML=`<button class="btn primary" id="nx">${s.r+1<s.rounds.length?L("Nächste Runde","Next round"):(s.opt.nextLabel||L("Fertig","Done"))}</button>`;
    $("#nx").onclick=()=>{ if(s.r+1<s.rounds.length){s.r++;pairRound();} else if(DB.missLvl>0&&!s.extra&&s.missed.size){ s.extra=true; s.extraStart=s.rounds.length; const ids=shuffle([...s.missed]); for(let i=0;i<ids.length;i+=5) s.rounds.push(ids.slice(i,i+5)); s.r++; toast(L("Fehlerrunde: deine falschen Paare nochmal","Mistakes round: your wrong pairs again")); pairRound(); } else pairsDone(); };
  };
  draw();
}
function pairsDone(){
  const s=session; const n=s.rounds.slice(0,s.extra?s.extraStart:s.rounds.length).reduce((a,r)=>a+r.length,0);
  if(s.opt.next){ toast(s.miss?`${n} ${L("Paare","pairs")} · ${s.miss} ${L("Fehler","mistakes")}`:`${n} ${L("Paare ohne Fehler","pairs, no mistakes")}`); s.opt.next(); return; }
  session=null;
  const draw=()=>{
    const body=`<div class="result"><div class="pct">${s.miss}</div><div class="lbl">${L("Fehler bei","mistakes in")} ${n} ${L("Paaren","pairs")}</div></div>
     <button class="btn primary" id="again">${L("Nochmal","Again")}</button><button class="btn ghost" id="back2">${L("Zurück zu Üben","Back to Practice")}</button>`;
    shell(MODE("paa"),body,{redraw:draw});
    $("#again").onclick=()=>{ const pool=practicePool(); startPairs(pickSet(pool,sessN(pool.length)),{title:MODE("paa"),backLabel:L("Üben","Practice"),backTo:"ueben"}); };
    $("#back2").onclick=()=>go("ueben");
  };
  draw();
}

   <p class="muted small">${missCount()} ${L("Wörter mit Fehlern gemerkt.","words with mistakes remembered.")}</p>
   ${!TTS?`<p class="muted small">${L("Hören ist in diesem Browser nicht verfügbar.","Listening isn't available in this browser.")}</p>`:""}`;
  shell(L("Üben","Practice"),body,{redraw:ueben});
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pr[b.dataset.k]=b.dataset.v;ueben();});
  bindMissLevel(ueben);
  $("#go").onclick=()=>{ const ids=(pr.src==="today"||pr.src==="week")?shuffle(pool).slice(0,sessN(pool.length)):pickSet(pool,sessN(pool.length)); if(pr.mode==="paa") startPairs(ids,{title:MODE("paa"),backLabel:L("Üben","Practice"),backTo:"ueben"}); else startQuiz(ids,"prac",{srs:false,mode:pr.mode}); };
}
function sessN(len){ return pr.n==="all"?len:Math.min(len,+pr.n); }
function levelThemes(){ const s=new Set(LW().map(w=>w.t)); return themeOrder(DB.level).concat(["klein"]).filter(t=>s.has(t)); }
function practicePool(){
  return LW().filter(w=>{
    if(pr.theme!=="all"&&w.t!==pr.theme) return false;
    const c=DB.cards[w.id];
    if(pr.src==="started"&&!c) return false;
    if(pr.src==="today"&&!(c&&c.d===today())) return false;
    if(pr.src==="week"&&!(c&&c.d>=addDays(today(),-6))) return false;
    if(pr.src==="weak"&&!((c&&(c.lv<=1||c.bad>c.ok))||DB.miss[w.id])) return false;
    if(pr.mode==="art"&&!modesFor(w).includes("art")) return false;
    return true;
  }).map(w=>w.id);
}

  const cm=$("#clrMiss"); if(cm) cm.onclick=()=>{ DB.miss={}; save(); toast(L("Fehler gelöscht","Mistakes cleared")); mehr(); };
  $("#copy").onclick=()=>{const t=$("#exp");const v=t.value;const fall=()=>{t.focus();t.select();toast(L("Code markiert. Jetzt kopieren.","Code selected. Copy it now."));};try{navigator.clipboard.writeText(v).then(()=>toast(L("Code kopiert","Code copied")),fall);}catch(e){fall();}};
  $("#load").onclick=()=>{try{const p=JSON.parse(decodeURIComponent(escape(atob($("#imp").value.trim()))));if(!p||typeof p.cards!=="object")throw 0;DB=Object.assign(FRESH(),p);migrate();LEVELS.forEach(rebuildSeq);save();toast(L("Fortschritt geladen","Progress loaded"));go("home");}catch(e){toast(L("Der Code ist ungültig. Bitte ganz einfügen.","That code isn't valid. Please paste all of it."));}};
  let armed=false; $("#reset").onclick=e=>{ if(!armed){armed=true;e.target.textContent=L("Nochmal tippen: wirklich alles löschen","Tap again: really delete everything");e.target.classList.add("bad");return;} const lang=DB.lang; DB=FRESH(); DB.lang=lang; LEVELS.forEach(rebuildSeq); save(); toast(L("Gelöscht","Deleted")); go("home"); };
}

renderTabs(); go("home");
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
